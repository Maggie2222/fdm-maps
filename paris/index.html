    .masthead h1{font-size:30px;letter-spacing:4px;}
    .modal{padding:34px 26px 30px;}
  }

<script>
const PLANETS = {
  eiffel:{
    no:"01", char:"点灯人的星球", name:"埃菲尔铁塔", en:"Tour Eiffel",
    tags:["1889 年","战神广场","330 米"],
    body:[
      "1889 年，古斯塔夫·埃菲尔为巴黎世界博览会设计了这座铁塔——高 330 米，在之后的四十年里一直是世界上最高的建筑。落成之初它曾被艺术家们联名抵制，如今却成了巴黎本身的名字。",
      "每到日落后的整点，两万盏金灯会同时闪烁五分钟。整座城市安静下来抬头看它的样子，很像小王子遇到的那位点灯人：一丝不苟地，把自己的星球点亮一遍又一遍。",
      "乘电梯登上塔顶，可以看见巴黎所有的屋顶铺向地平线。如果你的旅程从这里开始，那正好——从这里起飞，去往下一颗星球。"
    ],
    quote:"“正因为你为你的玫瑰花费了时间，你的玫瑰才变得如此重要。”",
    link:{url:"https://www.toureiffel.paris/en", label:"官网 · toureiffel.paris"}
  },
  triomphe:{
    no:"02", char:"虚荣的人的星球", name:"凯旋门", en:"Arc de Triomphe",
    tags:["1836 年","香榭丽舍大街","戴高乐广场"],
    body:[
      "1806 年拿破仑在奥斯特里茨战役后下令修建，1836 年落成。门上刻着跟随帝国大军出征的 660 位将领的名字与四组巨型浮雕，是献给「荣耀」本身的建筑。",
      "拱门正下方是无名烈士墓，长明火自 1923 年燃烧至今，每天傍晚都会被重新点燃一次——像那位虚荣的人脱帽致意，等待着不为任何人、却为所有人的掌声。",
      "十二条林荫大道以凯旋门为圆心向四面放射，香榭丽舍大街从门前笔直铺向卢浮宫。站在门顶环顾，你会明白为什么全世界都愿意为它驻足。"
    ],
    quote:"“虚荣的人听不见别的，只有赞美。”",
    link:{url:"https://www.paris-arc-de-triomphe.fr/en", label:"官网 · paris-arc-de-triomphe.fr"}
  },
  louvre:{

    body:[
      "它先是一座 12 世纪的城堡，然后是历代国王的宫殿，1793 年起成为向公众开放的博物馆。如今馆内收藏超过 50 万件作品，从《汉谟拉比法典》到德拉克洛瓦，横跨七千年。",
      "1989 年，贝聿铭设计的玻璃金字塔落在拿破仑庭院正中，把古典宫墙与当代几何接在了一起——每年一千多万人从这里走进地下，再走进历史。",

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const traveler = document.getElementById('traveler');

function moveTravelerTo(el){
  if(!el || !traveler) return;
  const ball = el.querySelector('.planet-img');
  if(!ball) return;
  const map = traveler.offsetParent;                 // .map
  const br = ball.getBoundingClientRect();
  const mr = map.getBoundingClientRect();
  const cx = br.left + br.width/2 - mr.left;         // 球心 x
  const topY = br.top - mr.top;                      // 球顶边缘
  traveler.style.left = cx + 'px';
  traveler.style.top  = (topY + 16) + 'px';          // 脚略踩进球顶
}
moveTravelerTo(document.querySelector('[data-planet="eiffel"]'));  // 初始停在 1 号星球旁

function openPlanet(key){
  const p = PLANETS[key];
  if(!p) return;
  const el = document.querySelector('[data-planet="'+key+'"]');
  moveTravelerTo(el);   // 小王子飞到当前星球
  modal.innerHTML = `
    <button class="modal-close" aria-label="关闭">✕</button>
    <div class="m-eyebrow">${p.char} · Station ${p.no}</div>
    <div class="m-title">${p.name}</div>
    <div class="m-en">${p.en}</div>
    <div class="m-rule"></div>
    <div class="m-body">${p.body.map(t=>`<p>${t}</p>`).join('')}</div>
    <div class="m-tags">${p.tags.map(t=>`<span class="m-tag">${t}</span>`).join('')}</div>
    <div class="m-quote">${p.quote}</div>
    <a class="m-link" href="${p.link.url}" target="_blank" rel="noopener">${p.link.label} ↗</a>
  `;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closePlanet(){
  overlay.classList.remove('open');
  document.body.style.overflow='';
}
document.querySelectorAll('[data-planet]').forEach(el=>{
  el.addEventListener('click',()=>openPlanet(el.dataset.planet));
});
modal.addEventListener('click',e=>{ if(e.target.classList.contains('modal-close')) closePlanet(); });
overlay.addEventListener('click',e=>{ if(e.target===overlay) closePlanet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePlanet(); });
</script>
