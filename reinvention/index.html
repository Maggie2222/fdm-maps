<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Art of Reinvention — Paris · Munich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0a0c;overflow:hidden;font-family:"Noto Serif SC",serif;color:#f3ece0}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    overflow:hidden;background:#1a1320;box-shadow:0 0 80px rgba(0,0,0,.6)}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
  .scene.active{opacity:1}

  /* ===== Act 1/2 法国：明信片(刻板印象) —— 裂开后印象派画作完整接管 ===== */
  #scene-paris .reveal{position:absolute;inset:0;background:url('assets/impressionist.png') center/cover;
    transform:scale(1.1);filter:brightness(.4) saturate(.8) blur(1.5px);
    transition:filter .45s ease, transform .6s ease}
  #scene-paris.cracked .reveal{filter:brightness(1.02) saturate(1) blur(0);transform:scale(1)}
  #scene-paris .split{position:absolute;inset:0;background:url('assets/paris-postcard.png') center/cover;will-change:transform,opacity}
  #scene-paris.cracked .shard-1{animation:flyL .5s cubic-bezier(.2,.8,.3,1) forwards}
  #scene-paris.cracked .shard-2{animation:flyU .5s cubic-bezier(.2,.8,.3,1) forwards}
  #scene-paris.cracked .shard-3{animation:flyR .5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes flyL{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    18%{transform:translate(-3%,0) rotate(-.6deg);opacity:1}
    100%{transform:translate(-30%,2%) rotate(-3deg);opacity:0}}
  @keyframes flyU{
    0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    18%{transform:translate(0,-2%) scale(1.03);opacity:1}
    100%{transform:translate(0,-26%) scale(1.1) rotate(1.4deg);opacity:0}}
  @keyframes flyR{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    18%{transform:translate(3%,0) rotate(.6deg);opacity:1}
    100%{transform:translate(30%,-2%) rotate(3deg);opacity:0}}
  #scene-paris .pink{position:absolute;inset:0;background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,200,220,.20), transparent 60%),
    linear-gradient(180deg, rgba(255,180,205,.12), rgba(255,210,225,.06));mix-blend-mode:soft-light;pointer-events:none;
    transition:opacity .35s ease}
  #scene-paris.cracked .pink{opacity:.3}
  .seam{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .1s ease;z-index:6}
  .cracked .seam{opacity:1}
  .seam path{fill:none;stroke:rgba(255,252,246,.95);stroke-width:.5;
    filter:drop-shadow(0 0 7px rgba(255,255,255,.85))}
  /* 快速描出 → 短促停留 → 消失，不留痕 */
  .cracked .seam path{animation:seamDraw .2s ease forwards, seamFade .22s ease .24s forwards}
  @keyframes seamDraw{to{stroke-dashoffset:0}}
  @keyframes seamFade{to{opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
  .cracked .flash{animation:flashPop .28s ease-out forwards}
  @keyframes flashPop{0%{opacity:.85}45%{opacity:.24}100%{opacity:0}}

  /* ===== Act 3/4 德国：蓝图 —— 齿轮真正相切啮合运转，随后失同步 ===== */
  #scene-germany .blue{position:absolute;inset:0;background:url('assets/germany-blueprint.png') center/cover;
    filter:contrast(1.02) brightness(.9)}
  #scene-germany .blue-tint{position:absolute;inset:0;
    background:radial-gradient(46% 62% at 48% 40%, rgba(18,34,60,.18), rgba(10,20,38,.62) 78%),
    linear-gradient(180deg,rgba(30,55,90,.3),rgba(12,22,40,.45))}
  #scene-germany .route{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;z-index:5}
  #scene-germany.reverse .route{opacity:1}
  .gears{position:absolute;inset:0;z-index:4;pointer-events:none}
  .gears svg{width:100%;height:100%;display:block}
  .gear .spin{animation:rot var(--dur) linear infinite;animation-direction:var(--dir)}
  @keyframes rot{to{transform:rotate(360deg)}}
  .gear .gpath{fill:rgba(201,155,74,.13);stroke:#e0b165;stroke-width:3.2;stroke-linejoin:round}
  .gear .gspoke{stroke:#e0b165;stroke-width:2.4;opacity:.75}
  .gear .ghub{fill:rgba(14,26,46,.6);stroke:#e0b165;stroke-width:2.8}
  .gear .gring{fill:none;stroke:#e0b165;stroke-width:1.8;stroke-dasharray:9 9;opacity:.4}
  /* 破局：不再严丝合缝——各轮转速与相位全部错乱 */
  #scene-germany.desync .gear:nth-child(1) .spin{animation-duration:2.2s}
  #scene-germany.desync .gear:nth-child(2) .spin{animation-duration:7.5s;animation-direction:normal}
  #scene-germany.desync .gear:nth-child(3) .spin{animation-duration:3.1s;animation-direction:reverse}
  #scene-germany.desync .gear:nth-child(4) .spin{animation-duration:5.4s}
  #scene-germany.desync .gear:nth-child(5) .spin{animation-duration:1.7s;animation-direction:reverse}

  /* ===== Act 5 重组 + 城堡 ===== */
  #scene-recombine{background:radial-gradient(80% 80% at 50% 50%, #2a2336, #0e0a14)}
  #scene-recombine .piece{position:absolute;width:40%;height:60%;top:20%;background-size:cover;background-position:center;
    border:8px solid rgba(246,236,216,.85);box-shadow:0 16px 50px rgba(0,0,0,.5);opacity:0}
  #scene-recombine.active .pA{left:6%;animation:flyA 3.6s ease forwards}
  #scene-recombine.active .pB{right:6%;animation:flyB 3.6s ease forwards}
  @keyframes flyA{0%{opacity:0;transform:translate(-40%,0) rotate(-18deg)}30%{opacity:1}
    100%{opacity:1;left:30%;transform:translate(0,0) rotate(-4deg)}}
  @keyframes flyB{0%{opacity:0;transform:translate(40%,0) rotate(18deg)}30%{opacity:1}
    100%{opacity:1;right:30%;transform:translate(0,0) rotate(4deg)}}
  #scene-recombine .castle{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  #scene-recombine.castle-in .castle{opacity:1}
  #scene-recombine.castle-in .piece{opacity:0;transition:opacity .6s ease}

  /* ===== 标题卡 ===== */
  #scene-title{background:radial-gradient(90% 90% at 50% 40%, #1b1426, #060409);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #scene-title .kicker{font-family:"Playfair Display",serif;font-style:italic;color:#c9a15a;letter-spacing:3px;font-size:clamp(12px,1.6vw,22px);opacity:0;transition:opacity .8s ease}
  #scene-title .big{font-family:"Playfair Display",serif;font-weight:600;color:#f3ece0;letter-spacing:4px;
    font-size:clamp(26px,4.6vw,62px);margin:.3em 0;opacity:0;transition:opacity 1s ease .25s}
  #scene-title .sub{font-family:"Noto Serif SC",serif;font-weight:300;color:#b9aec4;letter-spacing:1px;
    font-size:clamp(12px,1.8vw,24px);opacity:0;transition:opacity 1s ease .55s}
  #scene-title .star{margin-top:5vh;opacity:0;transition:opacity 1.1s ease .85s}
  #scene-title.active .kicker,#scene-title.active .big,#scene-title.active .sub,#scene-title.active .star{opacity:1}

  /* ===== 字幕（始终单行，超宽自动缩放） ===== */
  #subtitle{position:absolute;left:50%;transform:translateX(-50%);bottom:6.5%;white-space:nowrap;
    text-align:center;padding:.4em 1.05em;background:rgba(16,11,20,.62);border:1px solid rgba(243,236,224,.22);
    border-radius:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    font-family:"Noto Serif SC",serif;font-weight:600;color:#fdf6ea;font-size:clamp(15px,2.5vw,34px);
    letter-spacing:1.5px;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .4s ease;z-index:30}
  #subtitle.show{opacity:1}
  #subtitle.france{border-color:rgba(192,83,62,.7);box-shadow:0 0 26px rgba(192,83,62,.28)}

  /* ===== 开始遮罩 ===== */
  #intro{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(80% 80% at 50% 45%, #211828, #07050b);cursor:pointer}
  #intro h1{font-family:"Playfair Display",serif;font-style:italic;color:#c9a15a;font-size:clamp(22px,3.4vw,44px);letter-spacing:2px}
  #intro p{color:#b9aec4;margin-top:1.2em;font-weight:300;font-size:clamp(12px,1.6vw,18px);letter-spacing:1px}
  #intro .play{margin-top:2.4em;padding:.7em 2.2em;border:1px solid #c9a15a;color:#f3ece0;border-radius:40px;
    font-family:"Playfair Display",serif;letter-spacing:3px;font-size:clamp(13px,1.8vw,20px);transition:.3s}
  #intro:hover .play{background:#c9a15a;color:#160f1d}

  #mute{position:absolute;top:14px;right:16px;z-index:40;background:rgba(0,0,0,.35);border:1px solid rgba(243,236,224,.4);
    color:#f3ece0;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Serif SC",serif;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <!-- Act 1/2 法国 -->
    <div class="scene" id="scene-paris">
      <div class="reveal"></div>
      <div class="split shard-1"></div>
      <div class="split shard-2"></div>
      <div class="split shard-3"></div>
      <div class="pink"></div>
      <svg class="seam" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="flash"></div>
    </div>

    <!-- Act 3/4 德国 -->
    <div class="scene" id="scene-germany">
      <div class="blue"></div>
      <div class="blue-tint"></div>
      <svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M8,92 C30,70 22,46 46,40 C70,34 66,16 88,12" fill="none" stroke="#e0b15a" stroke-width="1" stroke-dasharray="3 2"/>
      </svg>
      <div class="gears"></div>
      <div class="flash"></div>
    </div>

    <!-- Act 5 重组 + 城堡 -->
    <div class="scene" id="scene-recombine">
      <div class="piece pA" style="background-image:url('assets/paris-postcard.png')"></div>
      <div class="piece pB" style="background-image:url('assets/germany-blueprint.png')"></div>
      <div class="castle">
        <img src="assets/castle-fog.png" alt="" style="width:100%;height:100%;object-fit:cover">
      </div>
    </div>

    <!-- 标题卡 -->
    <div class="scene" id="scene-title">
      <div class="kicker">A short film</div>
      <div class="big">THE ART OF REINVENTION</div>
      <div class="sub">Paris. Munich. And everything you thought you knew.</div>
      <svg class="star" width="46" height="46" viewBox="0 0 24 24">
        <path d="M12 2l2.4 6.9H22l-5.8 4.2 2.2 6.9L12 16l-6.4 4.2 2.2-6.9L2 8.9h7.6z"
          fill="none" stroke="#c9a15a" stroke-width="1.2"/>
      </svg>
    </div>

    <div id="subtitle"></div>
    <button id="mute">♪ 配乐：开</button>

    <div id="intro">
      <h1>The Art of Reinvention</h1>
      <p>Paris · Munich — 一段 30 秒的序章</p>
      <div class="play">▶ 播放预告片</div>
    </div>

  </div>
</div>

<script>
(function(){
  /* 两道完整的闪电裂缝：把画面切成三片，碎片飞散后印象派画作完整接管 */
  var CRACK_A = [[34,0],[28,6],[37,12],[26,19],[34,26],[24,33],[32,40],[22,47],
                 [30,54],[20,61],[28,68],[19,75],[27,82],[21,89],[26,100]];
  var CRACK_B = [[70,0],[77,7],[67,14],[78,21],[68,28],[80,35],[70,42],[81,49],
                 [71,56],[82,63],[72,70],[83,77],[73,84],[79,91],[74,100]];

  function shardPolygon(k){
    var pts;
    if(k===1){
      pts = ['0% 0%'];
      for(var i=0;i<CRACK_A.length;i++) pts.push(CRACK_A[i][0]+'% '+CRACK_A[i][1]+'%');
      pts.push('0% 100%');
    } else if(k===2){
      pts = [];
      for(var i=0;i<CRACK_A.length;i++) pts.push(CRACK_A[i][0]+'% '+CRACK_A[i][1]+'%');
      for(var j=CRACK_B.length-1;j>=0;j--) pts.push(CRACK_B[j][0]+'% '+CRACK_B[j][1]+'%');
    } else {
      pts = ['100% 0%'];
      for(var i=0;i<CRACK_B.length;i++) pts.push(CRACK_B[i][0]+'% '+CRACK_B[i][1]+'%');
      pts.push('100% 100%');
    }
    return 'polygon(' + pts.join(',') + ')';
  }

  function buildSeam(svg){
    if(!svg) return;
    var NS='http://www.w3.org/2000/svg';
    [CRACK_A, CRACK_B].forEach(function(C){
      var p=document.createElementNS(NS,'polyline');
      p.setAttribute('points', C.map(function(c){return c[0]+','+c[1];}).join(' '));
      svg.appendChild(p);
      if(p.getTotalLength){
        var len=p.getTotalLength();
        p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      }
    });
  }

  /* ---- 齿轮组：统一模数 u=10.5（r = u*n，所有轮齿距相同），
         中心距 = 两轮分度圆半径之和（外切），转速周期 ∝ 半径，相邻反向 ---- */
  var U = 10.5;
  var GEARS = [
    {n:18, x:200, y:320, dir: 1},
    {n:13, x:0,   y:0,   dir:-1},
    {n:16, x:0,   y:0,   dir: 1},
    {n:11, x:0,   y:0,   dir:-1},
    {n:8,  x:0,   y:0,   dir: 1}
  ];
  GEARS.forEach(function(g){ g.r = g.n * U; });   // 分度圆半径
  var LINKS = [ 10, -9, 15, -6 ];   // 每级连线的角度

  function layoutGears(){
    GEARS[0].x = 200; GEARS[0].y = 320;
    for(var i=1;i<GEARS.length;i++){
      var a = LINKS[i-1]*Math.PI/180;
      var d = GEARS[i-1].r + GEARS[i].r;      // 外径相切：中心距 = 两轮半径之和
      GEARS[i].x = GEARS[i-1].x + d*Math.cos(a);
      GEARS[i].y = GEARS[i-1].y + d*Math.sin(a);
    }
  }

  function gearPath(n,R,r,cx,cy){
    var step=2*Math.PI/n, d='';
    function pt(a,rad){ return (cx+Math.cos(a)*rad).toFixed(2)+','+(cy+Math.sin(a)*rad).toFixed(2); }
    for(var i=0;i<n;i++){
      var a0=i*step;
      d += (i?'L':'M') + pt(a0+step*0.08, r);
      d += 'L' + pt(a0+step*0.20, R);
      d += 'L' + pt(a0+step*0.42, R);
      d += 'L' + pt(a0+step*0.54, r);
    }
    return d+'Z';
  }

  /* 啮合相位求解：
     约束 n_p*(α-φ_p) + n_g*(α+180-φ_g) ≡ C0 (mod 360)
     C0=90 保证齿正对齿隙 */
  function gearPhases(){
    var C0 = 90, phi = [0];
    for(var i=1;i<GEARS.length;i++){
      var p = GEARS[i-1], g = GEARS[i], a = LINKS[i-1];
      phi[i] = 180 + a - (C0 - p.n*(a - phi[i-1]))/g.n;
    }
    return phi;
  }

  function buildGears(box){
    if(!box) return;
    layoutGears();
    var T0 = 6, N0 = GEARS[0].n, phi = gearPhases();
    var html='<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">';
    GEARS.forEach(function(g, i){
      var dur = T0*g.n/N0;                        // 周期 ∝ 齿数 ∝ 半径 → 线速度一致
      var d = (phi[i]/(g.dir>0?360:-360)*dur)%dur; // 初始相位对齐齿隙
      if(d<0) d += dur;
      html += '<g class="gear"><g class="spin" style="transform-origin:'+g.x.toFixed(1)+'px '+g.y.toFixed(1)+'px;'
           +   '--dur:'+dur.toFixed(2)+'s;--dir:'+(g.dir>0?'normal':'reverse')+';animation-delay:-'+d.toFixed(2)+'s">'
           +   '<path class="gpath" d="'+gearPath(g.n, g.r + U*0.6, g.r - U*1.0, g.x, g.y)+'"/>'
           +   '<circle class="gring" cx="'+g.x.toFixed(1)+'" cy="'+g.y.toFixed(1)+'" r="'+(g.r+12).toFixed(1)+'"/>'
           +   '<line class="gspoke" x1="'+g.x.toFixed(1)+'" y1="'+g.y.toFixed(1)+'" x2="'+g.x.toFixed(1)+'" y2="'+(g.y-g.r*0.78).toFixed(1)+'"/>'
           +   '<line class="gspoke" x1="'+g.x.toFixed(1)+'" y1="'+g.y.toFixed(1)+'" x2="'+(g.x+g.r*0.68).toFixed(1)+'" y2="'+(g.y+g.r*0.2).toFixed(1)+'"/>'
           +   '<line class="gspoke" x1="'+g.x.toFixed(1)+'" y1="'+g.y.toFixed(1)+'" x2="'+(g.x-g.r*0.4).toFixed(1)+'" y2="'+(g.y+g.r*0.66).toFixed(1)+'"/>'
           +   '<circle class="ghub" cx="'+g.x.toFixed(1)+'" cy="'+g.y.toFixed(1)+'" r="'+(g.r*0.22).toFixed(1)+'"/>'
           + '</g></g>';
    });
    html += '</svg>';
    box.innerHTML = html;
  }

  /* 30 秒节奏：0-4.5 法国｜4.5-9 裂缝+印象派｜9-14 德国｜14-19.5 失同步｜19.5-25.5 重组+城堡｜25.5-30 标题 */
  var ACTS = [
    {t:0,    dur:4.5, scene:'scene-paris',      sub:'你是否认为法国等于艺术、浪漫、优雅。',        mood:'paris'},
    {t:4.5,  dur:4.5, scene:'scene-paris',      sub:'但如果，当时没有人认为它是艺术呢？',           mood:'silence'},
    {t:9,    dur:5,   scene:'scene-germany',    sub:'你是否认为德国代表了工程、秩序、精密。',        mood:'germany'},
    {t:14,   dur:5.5, scene:'scene-germany',    sub:'但当整个系统需要改变时呢？',                    mood:'germany'},
    {t:19.5, dur:6,   scene:'scene-recombine',  sub:'如果我们对一个地方的理解，只是故事的开始呢？', mood:'suspense'},
    {t:25.5, dur:4.5, scene:'scene-title',      sub:'',                                              mood:'fade'}
  ];

  var stage = document.getElementById('stage');
  var scenes = {
    'scene-paris':document.getElementById('scene-paris'),
    'scene-germany':document.getElementById('scene-germany'),
    'scene-recombine':document.getElementById('scene-recombine'),
    'scene-title':document.getElementById('scene-title')
  };
  var subtitle = document.getElementById('subtitle');
  var muteBtn = document.getElementById('mute');
  var intro = document.getElementById('intro');

  [1,2,3].forEach(function(k){
    scenes['scene-paris'].querySelector('.shard-'+k).style.clipPath = shardPolygon(k);
  });
  buildSeam(scenes['scene-paris'].querySelector('.seam'));
  buildGears(document.querySelector('.gears'));

  var TOTAL = 30;
  var startTs = 0, raf = 0, curIdx = -1, muted = false, musicReady = false;

  /* ---- 极简配乐（Web Audio 合成，可整体替换为 mp3） ---- */
  var Music = (function(){
    var ctx, master, nodes=[], timers=[];
    function ensure(){
      if(ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    }
    function clear(){
      nodes.forEach(function(n){ try{n.stop&&n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
      nodes=[]; timers.forEach(function(t){clearInterval(t);}); timers=[];
    }
    function pad(freqs){
      clear(); if(!ctx) return;
      master.gain.linearRampToValueAtTime(0.12, ctx.currentTime+1.2);
      freqs.forEach(function(f){
        var o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
        var g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(master);
        g.gain.linearRampToValueAtTime(0.05, ctx.currentTime+1.5); o.start(); nodes.push(o);
      });
    }
    function tick(){
      clear(); if(!ctx) return;
      master.gain.linearRampToValueAtTime(0.09, ctx.currentTime+0.3);
      var on=true;
      var t=setInterval(function(){
        if(!ctx) return;
        var o=ctx.createOscillator(); o.type='square'; o.frequency.value = on?200:150;
        var g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(master);
        var now=ctx.currentTime; g.gain.linearRampToValueAtTime(0.07, now+0.01);
        g.gain.exponentialRampToValueAtTime(0.0008, now+0.08);
        o.start(now); o.stop(now+0.1); on=!on;
      }, 400); timers.push(t);
    }
    function drone(){
      clear(); if(!ctx) return;
      master.gain.linearRampToValueAtTime(0.13, ctx.currentTime+1.2);
      [55,82.41].forEach(function(f){
        var o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
        var g=ctx.createGain(); g.gain.value=0.06;
        var lfo=ctx.createOscillator(); lfo.frequency.value=0.14;
        var lg=ctx.createGain(); lg.gain.value=0.035; lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(master); o.start(); lfo.start(); nodes.push(o,lfo);
      });
    }
    function silence(){ clear(); if(master) master.gain.linearRampToValueAtTime(0, ctx.currentTime+0.05); }
    return { ensure:ensure, pad:pad, tick:tick, drone:drone, silence:silence };
  })();

  function setScene(idx){
    for(var k in scenes){ scenes[k].classList.remove('active'); }
    scenes[ACTS[idx].scene].classList.add('active');
    scenes['scene-paris'].classList.toggle('cracked', idx===1);
    scenes['scene-germany'].classList.toggle('desync', idx===3);
    scenes['scene-germany'].classList.toggle('reverse', idx===3);
  }

  /* 字幕：始终单行，超宽则自动缩字号 */
  function fitSubtitle(){
    subtitle.style.fontSize='';
    var avail = stage.clientWidth * 0.88;
    var w = subtitle.getBoundingClientRect().width;
    if(w > avail && w > 0){
      var cur = parseFloat(getComputedStyle(subtitle).fontSize) || 16;
      subtitle.style.fontSize = Math.max(12, cur * (avail / w) * 0.97).toFixed(1) + 'px';
      w = subtitle.getBoundingClientRect().width;
      if(w > avail && w > 0){
        cur = parseFloat(getComputedStyle(subtitle).fontSize);
        subtitle.style.fontSize = Math.max(12, cur * (avail / w) * 0.98).toFixed(1) + 'px';
      }
    }
  }

  function setSub(idx){
    var txt = ACTS[idx].sub;
    if(txt){
      subtitle.textContent = txt;
      subtitle.className = 'show' + (idx<=1 ? ' france' : '');
      fitSubtitle();
    } else {
      subtitle.className = '';
    }
  }

  function setMood(idx){
    var m = ACTS[idx].mood;
    if(!musicReady) return;
    if(m==='paris') Music.pad([261.6,329.6,392.0]);
    else if(m==='germany'||m==='suspense'){ if(m==='germany') Music.tick(); else Music.drone(); }
    else if(m==='silence'){ Music.silence();
      setTimeout(function(){ if(musicReady && curIdx===1) Music.pad([261.6,329.6]); }, 500);
    }
    else if(m==='fade'){ Music.silence(); }
  }

  function frame(now){
    var t = (now - startTs)/1000;
    if(t >= TOTAL){ cancelAnimationFrame(raf); return; }
    var idx=0; for(var i=0;i<ACTS.length;i++){ if(t>=ACTS[i].t) idx=i; }
    if(idx!==curIdx){
      curIdx=idx; setScene(idx); setSub(idx); setMood(idx);
    }
    // Act5 晚期揭示城堡（22.5s 起）
    if(t>=22.5) scenes['scene-recombine'].classList.add('castle-in');
    else scenes['scene-recombine'].classList.remove('castle-in');
    raf = requestAnimationFrame(frame);
  }

  function start(){
    intro.style.display='none';
    Music.ensure(); musicReady=true;
    startTs = performance.now();
    curIdx=-1;
    raf = requestAnimationFrame(frame);
  }
  intro.addEventListener('click', start);
  window.addEventListener('resize', fitSubtitle);

  muteBtn.addEventListener('click', function(){
    muted=!muted;
    muteBtn.textContent = muted ? '♪ 配乐：关' : '♪ 配乐：开';
    if(musicReady){ try{ if(muted) Music.silence(); else setMood(curIdx<0?0:curIdx); }catch(e){} }
  });
})();
</script>
</body>
